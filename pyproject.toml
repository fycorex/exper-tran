[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "primary-ml-cka"
version = "0.1.0"
description = "Proxy classification and proxy-representation CKA black-box transfer experiment"
readme = "README.md"
requires-python = "==3.11.*"
license = {text = "GPL-3.0-only"}
dependencies = [
  "accelerate==1.2.1",
  "bitsandbytes==0.49.0",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==5.14.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "ruff==0.8.4"]
vllm = ["vllm==0.6.4.post1"]

[project.scripts]
primary-ml-cka = "primary_ml_cka.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: requires CUDA and local checkpoints",
  "smoke: loads real model components",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
